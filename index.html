<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shinhan SOL Vietnam - UI/UX Demo</title>
    <style>
        :root {
            --shinhan-blue: #0046ff;
            --shinhan-dark: #002d9c;
            --shinhan-light-blue: #e8f0fe;
            --bg-gray: #f4f6f9;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border-color: #e2e8f0;
            --success-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #dce3ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Khung ứng dụng tối ưu cho cả Mobile & Desktop */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        @media (max-width: 480px) {
            .app-container {
                max-width: 100%;
                height: 100vh;
                max-height: none;
                box-shadow: none;
            }
        }

        /* ================= LOGO SHINHAN SOL CHUẨN ================= */
        .sol-logo {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        .sol-logo-top {
            font-size: 13px;
            font-weight: 700;
            color: var(--shinhan-blue);
            align-self: flex-start;
            margin-bottom: -6px;
            letter-spacing: -0.3px;
        }
        .sol-logo-mid {
            font-size: 38px;
            font-weight: 900;
            color: var(--shinhan-blue);
            letter-spacing: -2px;
            line-height: 1;
            display: flex;
            align-items: center;
        }
        .sol-logo-mid span.o-ring {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 5px solid var(--shinhan-blue);
            border-radius: 50%;
            margin: 0 1px;
            transform: translateY(2px);
        }
        .sol-logo-bot {
            font-size: 15px;
            font-weight: 700;
            color: var(--shinhan-blue);
            align-self: flex-end;
            margin-top: -2px;
        }

        /* Logo bản thu nhỏ cho Header */
        .sol-logo.sm .sol-logo-top { font-size: 9px; margin-bottom: -3px; }
        .sol-logo.sm .sol-logo-mid { font-size: 20px; letter-spacing: -1px; }
        .sol-logo.sm .sol-logo-mid span.o-ring { width: 15px; height: 15px; border-width: 3px; }
        .sol-logo.sm .sol-logo-bot { font-size: 10px; }

        /* ================= CÁC MÀN HÌNH ================= */
        .screen {
            position: absolute;
            inset: 0;
            background-color: #ffffff;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            z-index: 1;
        }
        .screen.active {
            display: flex;
        }

        /* 1. MÀN HÌNH SPLASH (ẢNH 1) */
        #splashScreen {
            justify-content: center;
            align-items: center;
            z-index: 50;
            background: #ffffff;
            transition: opacity 0.4s ease;
        }

        /* HEADER CHUNG */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: #ffffff;
        }
        .top-icons {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #334155;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #334155;
            position: relative;
        }
        .notif-dot {
            position: absolute;
            top: 0;
            right: 1px;
            width: 7px;
            height: 7px;
            background: #ef4444;
            border-radius: 50%;
        }
        .vn-flag {
            width: 22px;
            height: 22px;
            background: #da251d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffff00;
            font-size: 12px;
            font-weight: bold;
        }

        /* 2. MÀN HÌNH HOME CHƯA ĐĂNG NHẬP (ẢNH 2) */
        #homeScreen {
            background-color: #f8fafc;
        }
        .welcome-banner {
            margin: 4px 16px 16px;
            background: linear-gradient(135deg, #0052ff 0%, #0039cb 100%);
            border-radius: 16px;
            padding: 18px 16px;
            color: white;
            box-shadow: 0 6px 16px rgba(0, 70, 255, 0.2);
        }
        .welcome-banner p {
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 16px;
        }
        .welcome-banner strong {
            font-size: 16px;
            display: block;
        }
        .banner-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-register {
            background: rgba(0, 26, 102, 0.55);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-login-trigger {
            background: #e2ecff;
            color: #0039cb;
            border: none;
            padding: 11px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .section-title {
            padding: 4px 18px 12px;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-dark);
        }
        .service-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 16px 80px;
        }
        .service-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 12px 10px;
            min-height: 112px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .service-card:active {
            transform: scale(0.97);
        }
        .service-card h4 {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
            line-height: 1.25;
        }
        .service-card p {
            font-size: 11px;
            color: var(--text-gray);
            line-height: 1.3;
        }
        .service-icon {
            align-self: flex-end;
            font-size: 20px;
            margin-top: 6px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 8px 0 10px;
            z-index: 5;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-gray);
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--shinhan-blue);
            font-weight: 600;
        }
        .qr-circle {
            width: 34px;
            height: 34px;
            background: #e2e8f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -8px;
            color: #1e293b;
            font-weight: bold;
        }

        /* 3. MÀN HÌNH ĐĂNG NHẬP (ẢNH 3) */
        #loginScreen {
            background-color: #f4f7fb;
            justify-content: space-between;
        }
        .login-card {
            background: #ffffff;
            margin: 10px 16px;
            border-radius: 18px;
            padding: 20px 18px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
        }
        .greeting-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }
        .bear-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #cbe4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            border: 2px solid #e0efff;
        }
        .greeting-text {
            font-size: 17px;
            font-weight: 600;
            color: #475569;
        }
        .login-input-box {
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 15px 16px;
            margin-bottom: 12px;
            background: #ffffff;
            transition: border-color 0.2s;
        }
        .login-input-box:focus-within {
            border-color: var(--shinhan-blue);
        }
        .login-input-box input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
            color: var(--text-dark);
        }
        .login-input-box input::placeholder {
            color: #64748b;
        }
        .forgot-links {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-top: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }
        .forgot-links span {
            cursor: pointer;
        }
        .divider-v {
            width: 1px;
            height: 14px;
            background: #cbd5e1;
        }
        .btn-shinhan-primary {
            width: calc(100% - 32px);
            margin: 6px 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.3px;
        }
        .btn-shinhan-primary:active {
            background-color: var(--shinhan-dark);
        }
        .div-badge {
            text-align: center;
            margin: 14px 0;
            color: #0284c7;
            font-size: 11px;
            font-weight: 700;
        }
        .div-badge span {
            display: block;
            font-size: 8px;
            color: #64748b;
            font-weight: 500;
        }
        .login-footer-tools {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 16px 12px 24px;
            text-align: center;
        }
        .footer-tool-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 11.5px;
            color: #475569;
            cursor: pointer;
        }
        .tool-icon-circle {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #dbeafe;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* 4. MÀN HÌNH CHUYỂN TIỀN (ĐỒNG BỘ SHINHAN) */
        #transferScreen {
            background-color: #f4f7fb;
        }
        .transfer-header {
            background: linear-gradient(135deg, #0046ff, #002d9c);
            color: white;
            padding: 16px 18px 24px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .transfer-top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .transfer-top-nav h3 {
            font-size: 17px;
            font-weight: 600;
        }
        .btn-back-white {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .balance-box {
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            padding: 14px 16px;
        }
        .balance-box .lbl { font-size: 12px; opacity: 0.85; }
        .balance-box .val { font-size: 22px; font-weight: 700; margin: 4px 0; }
        .balance-box .stk { font-size: 12.5px; opacity: 0.9; text-transform: uppercase; }

        .transfer-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }
        .field-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
        }
        .field-card label {
            display: block;
            font-size: 11.5px;
            color: var(--text-gray);
            margin-bottom: 5px;
            font-weight: 600;
        }
        .
